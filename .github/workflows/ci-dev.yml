name: CI - Dev Branch PR Check

on:
  pull_request:
    branches:
      - dev

jobs:
  ci-check:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    # Define environment variables required by docker-compose and your app
    env:
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: sello_test
      PORT: 5000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Start Database via Docker Compose
        run: |
          docker compose up -d db
        
      - name: Wait for Database to be Healthy
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until docker inspect --format="{{.State.Health.Status}}" sello_db | grep -m 1 "healthy"; do
            sleep 3
          done

      - name: Run Database Migrations
        run: |
          npm run migrate
        env:
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_NAME: sello_test

      - name: Lint Backend & Frontend
        run: |
          npm run lint -w backend || echo "No lint script in backend yet"
          npm run lint -w frontend || echo "No lint script in frontend yet"

      - name: Build Backend & Frontend
        run: |
          npm run build -w backend || echo "No build script in backend yet"
          npm run build -w frontend || echo "No build script in frontend yet"

      - name: Stop Database Container
        if: always()
        run: npm run db:down