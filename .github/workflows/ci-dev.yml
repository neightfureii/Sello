name: CI - Dev Branch PR Check

on:
  pull_request:
    branches:
      - dev

jobs:
  ci-check:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Backend & Frontend
        run: |
          npm run lint -w backend || echo "No lint script in backend yet"
          npm run lint -w frontend || echo "No lint script in frontend yet"

      - name: Build Backend & Frontend
        run: |
          npm run build -w backend || echo "No build script in backend yet"
          npm run build -w frontend || echo "No build script in frontend yet"